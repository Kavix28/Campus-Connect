<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oudience | Order Registry</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <style>
    .registry-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      padding: 40px;
      overflow-y: auto;
    }

    .registry-header {
      margin-bottom: 40px;
    }

    .registry-header h1 {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .registry-header p {
      color: var(--text-secondary);
      font-size: 16px;
    }

    .search-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 32px;
      margin-bottom: 32px;
    }

    .input-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 24px;
    }

    .form-field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-field label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-field input {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 12px 16px;
      color: var(--text-primary);
      font-family: inherit;
      outline: none;
      transition: all 0.2s;
    }

    .form-field input:focus {
      border-color: var(--accent);
      background: rgba(255, 255, 255, 0.08);
    }

    .action-btn {
      background: var(--accent);
      color: #0f172a;
      border: none;
      padding: 14px 28px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .action-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px var(--accent-glow);
    }

    .result-card {
      display: none;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      overflow: hidden;
      animation: slideUp 0.5s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .result-card.active {
      display: block;
    }

    .result-header {
      padding: 24px 32px;
      background: rgba(56, 189, 248, 0.1);
      border-bottom: 1px solid var(--glass-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .result-body {
      padding: 32px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 16px 0;
      border-bottom: 1px solid var(--glass-border);
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .label {
      color: var(--text-secondary);
    }

    .value {
      font-weight: 600;
    }

    .timeline-premium {
      margin-top: 32px;
      display: flex;
      gap: 20px;
      padding-top: 24px;
      border-top: 1px solid var(--glass-border);
    }

    .timeline-step {
      flex: 1;
      text-align: center;
      opacity: 0.3;
    }

    .timeline-step.active {
      opacity: 1;
    }

    .timeline-step.done {
      opacity: 1;
      color: var(--success);
    }

    .step-icon {
      width: 32px;
      height: 32px;
      background: var(--glass-border);
      border-radius: 50%;
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .done .step-icon {
      background: var(--success);
      color: white;
    }

    .active .step-icon {
      background: var(--accent);
      color: #0f172a;
      box-shadow: 0 0 15px var(--accent-glow);
    }
  </style>
</head>

<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="logo-container">
        <h1 class="logo-text">Oudience</h1>
      </div>
      <nav class="nav-links">
        <button class="nav-btn" onclick="location.href='/'">
          <span>💬</span> Chat Support
        </button>
        <button class="nav-btn active" onclick="location.href='/track-order'">
          <span>📦</span> Track Order
        </button>
      </nav>
    </aside>

    <main class="registry-container">
      <div class="registry-header">
        <h1>Order Registry</h1>
        <p>Access high-fidelity shipment details and real-time transit telemetry.</p>
      </div>

      <div class="search-card">
        <form id="searchForm">
          <div class="input-grid">
            <div class="form-field">
              <label>Order Reference</label>
              <input type="text" id="orderId" placeholder="AMZ..." />
            </div>
            <div class="form-field">
              <label>Email Address</label>
              <input type="email" id="email" placeholder="client@example.com" />
            </div>
          </div>
          <button type="submit" class="action-btn" id="searchBtn">Initialize Tracking</button>
        </form>
      </div>

      <div id="errorBox" class="system-msg error-msg" style="display:none; margin-bottom: 24px;"></div>

      <div class="result-card" id="resultCard">
        <div class="result-header">
          <h2 id="resOrderId" style="font-size: 20px;">Order #---</h2>
          <span id="resStatus" class="system-msg"
            style="background: var(--accent); color: #0f172a; border: none; font-weight: 700;">PROCESSED</span>
        </div>
        <div class="result-body">
          <div class="info-row">
            <span class="label">Destination Carrier</span>
            <span class="value" id="resCarrier">-</span>
          </div>
          <div class="info-row">
            <span class="label">Transit Node (Tracking ID)</span>
            <span class="value" id="resTrackId">-</span>
          </div>
          <div class="info-row">
            <span class="label">Estimated Delivery</span>
            <span class="value" id="resDelivery">-</span>
          </div>

          <div class="timeline-premium" id="timeline">
            <div class="timeline-step" id="step0">
              <div class="step-icon">1</div>
              <div style="font-size: 12px;">Processing</div>
            </div>
            <div class="timeline-step" id="step1">
              <div class="step-icon">2</div>
              <div style="font-size: 12px;">Shipped</div>
            </div>
            <div class="timeline-step" id="step2">
              <div class="step-icon">3</div>
              <div style="font-size: 12px;">Out for Delivery</div>
            </div>
            <div class="timeline-step" id="step3">
              <div class="step-icon">4</div>
              <div style="font-size: 12px;">Delivered</div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    const form = document.getElementById('searchForm');
    const searchBtn = document.getElementById('searchBtn');
    const resCard = document.getElementById('resultCard');
    const errorBox = document.getElementById('errorBox');

    form.onsubmit = async (e) => {
      e.preventDefault();
      errorBox.style.display = 'none';
      resCard.classList.remove('active');

      const orderId = document.getElementById('orderId').value.trim();
      const email = document.getElementById('email').value.trim();

      if (!orderId && !email) {
        errorBox.innerText = "Please provide order reference or email.";
        errorBox.style.display = 'block';
        return;
      }

      searchBtn.disabled = true;
      searchBtn.innerText = "Synchronizing...";

      try {
        const res = await fetch('/order/lookup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ order_id: orderId, email: email })
        });

        const data = await res.json();
        if (data.found) {
          const order = data.order;
          document.getElementById('resOrderId').innerText = `Order #${order.order_id}`;
          document.getElementById('resStatus').innerText = order.shipment_status.toUpperCase();
          document.getElementById('resCarrier').innerText = order.carrier || "Universal Logistics";
          document.getElementById('resTrackId').innerText = order.tracking_id || "TRK-PENDING";
          document.getElementById('resDelivery').innerText = new Date(order.expected_delivery).toLocaleDateString();

          // Update Timeline
          const steps = ['processing', 'shipped', 'out_for_delivery', 'delivered'];
          const currentIdx = steps.indexOf(order.shipment_status);

          steps.forEach((s, i) => {
            const el = document.getElementById('step' + i);
            el.classList.remove('active', 'done');
            if (i < currentIdx) el.classList.add('done');
            if (i === currentIdx) el.classList.add('active');
          });

          resCard.classList.add('active');
        } else {
          errorBox.innerText = data.message || "Record not found.";
          errorBox.style.display = 'block';
        }
      } catch (err) {
        errorBox.innerText = "Telemetry synchronization failure.";
        errorBox.style.display = 'block';
      } finally {
        searchBtn.disabled = false;
        searchBtn.innerText = "Initialize Tracking";
      }
    };
  </script>
</body>

</html>
