global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "flask-app"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:5001"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]
    # If you add node_exporter later
