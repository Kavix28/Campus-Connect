# =====================================================================
# DEVELOPMENT Compose — Oudience Chatbot
# =====================================================================
# Usage:  docker compose -f docker-compose.dev.yml up
# =====================================================================

services:
  chatbot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oudience_chatbot_dev
    restart: "no"

    env_file:
      - .env

    environment:
      FLASK_ENV: development
      FLASK_DEBUG: "1"
      RAG_SIMILARITY_THRESHOLD: "0.30"
      HF_HOME: /app/model_cache
      PORT: "5001"

    ports:
      - "5001:5001"

    # Bind-mount source for live editing (overrides COPY . . from image)
    volumes:
      - .:/app
      - oudience_model_cache:/app/model_cache
      - /app/.venv  # Exclude host venv from mount

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5001/test/system/health || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

    # No resource limits in dev
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  oudience_model_cache:
